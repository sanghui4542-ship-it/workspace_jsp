<!--
================================================================================
 파일명   : FetchAjax/2.html
 주제     : fetch 로 아이디 중복체크 하기 (실무 표준 형태)
 대상     : 비전공자
================================================================================

 이 파일에서 배우는 것
 --------------------------------------------------------------------------
 1. 공통 요청 함수를 만들어 재사용하는 방법
 2. AbortController 로 요청에 시간 제한(타임아웃)을 거는 방법
 3. 디바운스로 불필요한 요청을 줄이는 방법
 4. 삼항 연산자 ( 조건 ? 참일때 : 거짓일때 ) 문법

 참고. 이 화면의 동작 순서
 --------------------------------------------------------------------------

   [브라우저] 아이디 칸에 a 입력
       |
       | 400 밀리초 동안 추가 입력이 없는지 기다림
       |
       | (계속 타이핑하면 계속 취소되고 다시 400 밀리초를 셈)
       V
   [브라우저] 400 밀리초 동안 조용함 -> 그때 딱 1번 요청 전송
       |
       | idCheck.jsp?id=admin
       V
   [톰캣서버] idCheck.jsp
       |
       | 1초 동안 검사하는 척 대기
       | {"id":"admin", "exist":true} 응답
       V
   [브라우저] <span id="msg"> 영역에만 결과 문구 표시

   중요. 서버가 1초 동안 일하는 동안에도
        사용자는 비밀번호 칸과 이메일 칸에 계속 입력할 수 있습니다.
        화면이 전혀 멈추지 않습니다. 이것이 비동기 통신의 핵심 효과입니다.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>fetch 로 아이디 중복체크 하는 2.html 화면</title>

	<style type="text/css">
		body   { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2     { color:#1d5fa8; }
		.box   { background:#fff; border:1px solid #cbd5e2; border-radius:8px; padding:20px; max-width:660px; }
		.row   { margin-bottom:12px; }
		label  { display:inline-block; width:80px; font-weight:bold; }
		input  { padding:6px; border:1px solid #93a5bd; border-radius:4px; width:200px; }
		#msg   { margin-left:10px; font-weight:bold; }
		.note  { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
</head>
<body>

<h2>2. fetch + async/await — 아이디 중복체크 (실무 표준)</h2>

<div class="box">
	<div class="row">
		<label>아이디</label>

		<!-- id="id" : 자바스크립트가 이 입력칸을 찾을 때 사용할 이름표
		     placeholder : 아무것도 입력하지 않았을 때 회색으로 보이는 안내 문구 -->
		<input type="text" id="id" placeholder="admin, test, hong 은 중복">

		<!-- 검사 결과 문구가 표시될 자리입니다. 지금은 비어 있습니다. -->
		<span id="msg"></span>
	</div>

	<div class="row">
		<label>비밀번호</label>
		<!-- type="password" 로 지정하면 입력한 글자가 점(●)으로 가려집니다. -->
		<input type="password" id="pwd">
	</div>

	<div class="row">
		<label>이메일</label>
		<input type="text" id="email">
	</div>

	<p class="note">서버가 1초 동안 검사하는 사이에도 비밀번호와 이메일을 계속 입력할 수 있습니다.
	   이것이 비동기 통신의 핵심입니다.</p>
</div>

<script type="text/javascript">
/*
	참고. 이 파일에서 사용하는 실무 필수 기법 3가지

		1. 공통 요청 함수  : 프로젝트마다 하나만 만들어 모든 요청에서 재사용합니다.
		                    오류 처리 코드를 한 곳에서만 관리할 수 있습니다.

		2. 타임아웃        : 서버가 응답하지 않을 때 무한정 기다리지 않도록
		                    일정 시간이 지나면 요청을 강제로 취소합니다.

		3. 디바운스        : 글자를 칠 때마다 요청이 나가지 않도록
		                    마지막 입력 후 잠시 조용할 때만 요청을 보냅니다.
*/


</script>

</body>
</html>
