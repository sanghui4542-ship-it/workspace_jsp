<!--
================================================================================
 파일명   : step1.html
 단계     : 1단계 - 좌표를 고정해서 날씨 조회하기
 대상     : 비전공자 (자바스크립트를 처음 배우는 상태)
================================================================================

 이 단계의 목표
 ==========================================================================
 좌표를 코드에 직접 적어 두고 서울의 현재 날씨를 화면에 표시합니다.
 도시 검색은 아직 하지 않습니다. 2단계에서 추가합니다.

 이 단계에서 배우는 것
 ==========================================================================
 1. fetch 로 서버에 요청을 보내는 방법
 2. async 와 await 의 정확한 의미
 3. try catch finally 로 오류를 처리하는 방법
 4. 응답 상태(res.ok)를 직접 검사해야 하는 이유
 5. 화면의 일부분만 바꾸는 방법


 참고. 이 화면의 동작 순서
 ==========================================================================

   [브라우저]  step1.html
       |
       | (1) 조회 버튼 클릭
       | (2) fetch 로 Open-Meteo 서버에 요청
       |     좌표는 코드에 적어 둔 서울 좌표를 그대로 사용
       V
   [Open-Meteo 서버]
       |
       | (3) 현재 날씨를 JSON 으로 응답
       V
   [브라우저]
       |
       | (4) 결과 영역 안쪽에만 기온과 습도를 표시
       | (5) 페이지 전체는 새로 그려지지 않음


 참고. 동기 통신과 비동기 통신의 차이
 ==========================================================================

   [동기 통신]  = 지금까지 배운 form 전송 방식

     화면A ==요청==> 서버 ==HTML문서 전체==> 화면B (완전히 새 화면)

     화면이 하얗게 변했다가 전체가 새로 그려집니다.
     주소창의 주소도 바뀝니다.


   [비동기 통신] = 이 파일이 사용하는 Ajax 방식

     화면A ==요청==> 서버 ==값(JSON)==> 화면A 의 결과 영역만 변경

     화면은 그대로 있고 날씨 부분만 바뀝니다.
     주소창의 주소가 바뀌지 않습니다.
-->

<!DOCTYPE html>
<!-- 위 한 줄은 "이 문서는 HTML5 문법으로 작성했다" 고 브라우저에게 알려주는 선언입니다. -->

<html>
<head>
<!-- meta charset="UTF-8"
     이 문서에 적힌 한글이 깨지지 않도록 문자 저장 방식을 지정합니다.
     이 한 줄이 없으면 화면의 한글이 모두 깨져 보입니다. -->
<meta charset="UTF-8">

<title>1단계 - 좌표로 날씨 조회하기</title>

	<!--
		중요. 이 파일에는 jQuery 를 불러오는 script 태그가 없습니다.

		fetch 는 브라우저에 기본으로 들어 있는 기능이라
		따로 무엇을 불러올 필요가 없습니다.

		jQuery 를 쓰려면 파일을 먼저 불러와야 했던 것과 다른 점입니다.
	-->

	<style type="text/css">
		/* 아래는 화면을 보기 좋게 꾸미는 부분입니다.
		   통신 동작과는 관계가 없으므로 처음에는 넘어가도 됩니다. */
		body    { font-family:'Malgun Gothic'; padding:24px; background:#f4f7fb; }
		h2      { color:#1d5fa8; }
		.box    { background:#fff; border:1px solid #d5e0ec; border-radius:10px;
		          padding:22px; max-width:620px; }
		button  { background:#1d5fa8; color:#fff; border:none; padding:10px 20px;
		          border-radius:7px; cursor:pointer; font-size:14px; }

		/* button:disabled 는 버튼이 잠긴 상태일 때만 적용됩니다.
		   회색으로 변해 지금은 누를 수 없다는 것을 눈으로 알 수 있습니다. */
		button:disabled { background:#8fa2bb; cursor:not-allowed; }

		#result { margin-top:18px; padding:20px; background:#e8f0fb; border-radius:8px;
		          min-height:60px; }
		.temp   { font-size:44px; font-weight:bold; color:#0f1c2e; }
		.sub    { font-size:14px; color:#4a6280; margin-top:6px; }
		.err    { color:#c0392b; font-weight:bold; }
		.note   { color:#6b7c93; font-size:13px; margin-top:14px; }
		.nav    { margin-top:16px; font-size:14px; }
		.nav a  { color:#1d5fa8; font-weight:bold; text-decoration:none; margin-right:12px; }
	</style>
</head>
<body>

<h2>1단계 - 좌표를 고정해서 날씨 조회하기</h2>

<div class="box">

	<button id="btn">서울 날씨 조회</button>

	<div id="result">버튼을 눌러 보세요.</div>

	<p class="note">F12 를 눌러 Network 탭을 열어 두면
	   실제로 어떤 주소로 요청이 나가고 어떤 JSON 이 돌아오는지 볼 수 있습니다.</p>

	<div class="nav">
		<a href="index.html">처음으로</a>
		<a href="guide.html">자습서</a>
		<a href="step2.html">2단계로 넘어가기</a>
	</div>
</div>

<script type="text/javascript">

	//0.1 서울시청의 위도와 경도입니다.
	//
	//    위도(latitude)  : 적도에서 남북으로 얼마나 떨어졌는지 (한국은 33 ~ 38 사이)
	//    경도(longitude) : 영국 그리니치에서 동서로 얼마나 떨어졌는지 (한국은 125 ~ 130 사이)
	//
	//    2단계에서는 이 값을 코드에 적지 않고
	//    도시 이름을 검색해서 얻어 오도록 바꿉니다.
	const 위도 = 37.5665;
	const 경도 = 126.9780;
	
	//1. 날씨 조회 요청 함수 
	async function 날씨조회(){
		
		//1.1. 자주 쓰는 태그를 미리 찾아 상수에 담아 둡니다.
		const 결과영역 = document.getElementById("result"); //<div id="result">버튼을 눌러 보세요.</div>
		const 버튼 =    document.getElementById("btn");     //<button id="btn">서울 날씨 조회</button>
		
		//1.2. 조회 중임을 표시하고  버튼을 잠금(비화성화).
		버튼.disabled = true;
		결과영역.textContent = "날씨를 불러오는 중입니다...";
		
		/*
		===============================================================
		 참고. try catch finally 를 반드시 쓰는 이유
		===============================================================

			try     : 정상적으로 흘러갈 코드를 여기에 작성합니다.
			catch   : try 안에서 오류가 나면 즉시 여기로 넘어옵니다.
			          (서버가 꺼짐, 인터넷 끊김, 주소 오류 등)
			finally : 성공하든 실패하든 무조건 마지막에 실행됩니다.
			          버튼 잠금 해제 같은 뒷정리 코드를 여기에 씁니다.

			catch 가 없으면 인터넷이 끊겼을 때 화면이 아무 반응 없이 멈춰서
			사용자는 무슨 일이 일어났는지 전혀 알 수 없게 됩니다.

		참고. jQuery 와의 대응 관계

			try     { }   에 해당하는 것이   success  : function(){}
			catch   { }   에 해당하는 것이   error    : function(){}
			finally { }   에 해당하는 것이   complete : function(){}
		*/		
		try{
			//1.3. 요청주소를 만듭니다. 
			const 주소 = `https://api.open-meteo.com/v1/forecast`
				       +`?latitude=${위도}`
				       +`&longitude=${경도}`
				       +`&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m`
				       +`&timezone=Asia%2FSeoul`;
			
		    //1.4. fetch 함수(fetch API)로  요청을 보내고 응답 메세지를 기다립니다.
			const res = await fetch(주소);
		    
		    //1.5. 응답 상태를 직접 개발자가 검사 
		    if(!res.ok){
		    	throw new Error(`서버 오류 ${res.status}`);
		    }
		    
		    //1.6. HTTP응답 메세지 전체 중 .. body(본문) 영역에 응답받은 서울 날씨 정보를 json으로 받아 옵니다.
		    const data = await res.json();  
			/*
			data 로 받은 데이터의 실제 모습

			{
			  "latitude"  : 37.55,
			  "longitude" : 127.0,
			  "timezone"  : "Asia/Seoul",
			  "current_units" : {
			      "temperature_2m" : "°C",
			      "wind_speed_10m" : "km/h"
			  },
			  "current" : {
			      "time"                 : "2026-09-04T19:45",
			      "temperature_2m"       : 24.7,
			      "relative_humidity_2m" : 68,
			      "apparent_temperature" : 25.7,
			      "wind_speed_10m"       : 14.9
			  }
			}

			중요. 값들이 current 라는 객체 안에 들어 있습니다.
			     data.temperature_2m 이 아니라
			     data.current.temperature_2m 처럼 점을 두 번 찍어야 합니다.

			참고. current_units 에는 단위가 들어 있습니다.
			     화면에 도씨 기호를 직접 적는 대신 이 값을 써도 됩니다.
		*/
			//현재 날씨 값들이 담긴 current : {} 객체를 꺼냅니다.
			const 현재 = data.current;
			/*
			 {
			      "time"                 : "2026-09-04T19:45",  <- 현재 서울 시간 대  
			      "temperature_2m"       : 24.7,				<- 현재 서울 지상 2미터 높이의 기온
			      "relative_humidity_2m" : 68,                  <- 현재 서울 습도
			      "apparent_temperature" : 25.7,				<- 현재 서울 체감 온도
			      "wind_speed_10m"       : 14.9					<- 현재 서울 지상 10미터 높이의 풍속
			  }
			*/
			//브라우저 화면에 표시할 HTML 을 만듭니다.
			const html = `
				<div style="font-size:16px;color:blue;font-weight:bold">서울</div>
				<div class="temp">${현재.temperature_2m}&deg;C</div>
				<div class="sub">
					체감온도 ${현재.apparent_temperature}&deg;C &nbsp;|&nbsp;
					습도 ${현재.relative_humidity_2m}% &nbsp;|&nbsp;
					바람 풍속 ${현재.wind_speed_10m}km/h
				</div>
				<div calss="sub">기준 시각 ${현재.time.replace("T"," ")}</div>`;
			
			//<div id="result">버튼을 눌러 보세요.</div> 의  콘텐츠 영역에 html 상수 문자열 넣어 보여주자
			결과영역.innerHTML = html;
			   	
		}catch(err){		
			//오류가 발생하면 실행되는 부분
			결과영역.innerHTML = '<span class="err">날씨를 불러오지 못했습니다. 잠시후 다시 시도해 주세요</span>';
			console.log(err);
		}finally{
			
			//성공하든 실패하든 반드시 실행되는 부분
			버튼.disabled = false;
			
		}
		
	}
	//2. 버튼에 클릭 이벤트 등록 후 "날씨조회" 함수 호출!
	//===============================================================================
	//   addEventListener("이벤트이름", 실행할함수)
	//     "이 태그에서 이런 일이 벌어지면 이 함수를 실행하라" 고 등록합니다.
	//
	//   jQuery 의 $("#btn").on("click", ...) 과 같은 역할입니다.
	//
	//   주의. 함수 이름 뒤에 소괄호를 붙이지 않습니다.
	//     addEventListener("click", 날씨조회)     맞음. 나중에 실행하라고 넘기는 것
	//     addEventListener("click", 날씨조회())   틀림. 지금 즉시 실행하고 결과를 넘김
	document.getElementById("btn").addEventListener("click", 날씨조회);
	
	




</script>

</body>





</html>
