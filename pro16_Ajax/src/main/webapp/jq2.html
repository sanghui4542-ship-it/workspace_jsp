<!--
================================================================================
 파일명   : jq2.html
 단계     : 2단계 jQuery 버전 - 도시 이름으로 날씨 조회하기
 짝 파일  : step2.html (fetch 버전)
 대상     : 비전공자
================================================================================

 이 단계에서 반드시 눈으로 봐야 할 것
 ==========================================================================

   요청을 두 번 이어서 보낼 때 두 방식의 코드 모양이 크게 달라집니다.


   [fetch 버전]  위에서 아래로 순서대로 읽힙니다.

       const 지오응답 = await fetch(지오주소);
       const 지오데이터 = await 지오응답.json();
       const 장소 = 지오데이터.results[0];

       const 날씨응답 = await fetch(날씨주소);
       const 날씨데이터 = await 날씨응답.json();

       화면에 표시


   [jQuery 버전]  콜백함수 안에 콜백함수가 들어갑니다.

       $.ajax({
           success : function(지오데이터){
               $.ajax({
                   success : function(날씨데이터){
                       화면에 표시
                   }
               });
           }
       });

       요청이 세 번, 네 번 늘어나면 계속 안쪽으로 파고듭니다.
       이런 모양을 실무에서 콜백 지옥이라고 부릅니다.

   이것이 실무가 fetch 로 옮겨 간 가장 큰 이유입니다.
   아래 코드에서 들여쓰기가 어떻게 깊어지는지 직접 확인해 보세요.


 참고. 이 화면의 동작 순서 (step2.html 과 동일)
 ==========================================================================

   [브라우저]  Busan 입력 후 조회
       |
       | (1) 지오코딩 요청
       V
   [지오코딩 서버]  부산광역시 / 35.10 / 129.03
       |
       V
   [브라우저]
       |
       | (2) 받은 좌표로 날씨 요청
       V
   [날씨 서버]  현재 날씨
       |
       V
   [브라우저]  결과 영역에만 표시


 참고. 반드시 알아야 할 함정
 ==========================================================================

   지오코딩은 도시 이름을 영문으로 검색해야 합니다.

     name=Seoul   서울특별시가 나옵니다
     name=서울     결과가 하나도 나오지 않습니다

   대신 language=ko 를 붙이면 결과 이름은 한글로 옵니다.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2단계 jQuery 버전 - 도시 이름으로 날씨 조회하기</title>

	<!-- jQuery 문법을 사용하기 위해 jQuery 파일을 먼저 불러옵니다. -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<style type="text/css">
		body    { font-family:'Malgun Gothic'; padding:24px; background:#f4f7fb; }
		h2      { color:#1d5fa8; }
		.box    { background:#fff; border:1px solid #d5e0ec; border-radius:10px;
		          padding:22px; max-width:620px; }
		input   { padding:9px; border:1px solid #93a5bd; border-radius:5px; width:210px;
		          font-size:15px; }
		button  { background:#7c3aed; color:#fff; border:none; padding:10px 20px;
		          border-radius:7px; cursor:pointer; font-size:14px; margin-left:4px; }
		button:disabled { background:#a89ac4; cursor:not-allowed; }
		.quick  { margin-top:10px; }
		.quick span { display:inline-block; background:#f3eeff; color:#7c3aed;
		              border-radius:12px; padding:4px 12px; margin:3px 3px 0 0;
		              font-size:13px; cursor:pointer; }
		.quick span:hover { background:#7c3aed; color:#fff; }
		#result { margin-top:18px; padding:20px; background:#f3eeff; border-radius:8px;
		          min-height:60px; }
		.city   { font-size:17px; color:#7c3aed; font-weight:bold; }
		.temp   { font-size:44px; font-weight:bold; color:#0f1c2e; }
		.sub    { font-size:14px; color:#4a6280; margin-top:6px; }
		.err    { color:#c0392b; font-weight:bold; }
		.note   { color:#6b7c93; font-size:13px; margin-top:14px; }
		.nav    { margin-top:16px; font-size:14px; }
		.nav a  { color:#7c3aed; font-weight:bold; text-decoration:none; margin-right:12px; }
		.pair   { background:#f3eeff; border-left:4px solid #7c3aed; border-radius:0 8px 8px 0;
		          padding:12px 14px; margin-bottom:14px; font-size:13.5px; color:#5b3a9e; }
	</style>
</head>
<body>

<h2>2단계 jQuery 버전 - 도시 이름으로 날씨 조회하기</h2>

<div class="box">

	<div class="pair">
		<b>이 단계의 관전 포인트</b><br>
		아래 코드에서 <b>$.ajax 안에 $.ajax 가 또 들어가는 것</b>을 확인하세요.
		step2.html(fetch 버전)은 같은 일을 하면서도 들여쓰기가 깊어지지 않습니다.
	</div>

	도시 : <input type="text" id="city" value="Busan" placeholder="영문 도시명 (예: Seoul)">
	<button id="btn">조회</button>

	<!--
		자주 쓰는 도시 버튼입니다.
		data-name 속성에 영문 검색어를 담아 두고 자바스크립트가 꺼내 씁니다.
		화면에는 한글이 보이지만 실제 검색은 영문으로 나갑니다.
	-->
	<div class="quick">
		<span data-name="Seoul">서울</span>
		<span data-name="Busan">부산</span>
		<span data-name="Daegu">대구</span>
		<span data-name="Incheon">인천</span>
		<span data-name="Jeju">제주</span>
		<span data-name="Tokyo">도쿄</span>
	</div>

	<div id="result">도시를 입력하고 조회 버튼을 누르세요.</div>

	<p class="note">F12 Network 탭을 열고 조회해 보세요.
	   요청이 <b>두 번</b> 나가는 것을 확인할 수 있습니다.</p>

	<div class="nav">
		<a href="index.html">처음으로</a>
		<a href="jq1.html">1단계</a>
		<a href="step2.html">fetch 버전 보기</a>
		<a href="compare.html">문법 대조표</a>
		<a href="jq3.html">3단계로</a>
	</div>
</div>

<script type="text/javascript">

	//===================================================================
	//1. 날씨 조회 함수
	//===================================================================
	function 조회(){
		
		//1.1. <input type="text" id="city" value="Busan" placeholder="영문 도시명 (예: Seoul)"> 에 입력한 도시 이름 얻기
		const 도시 = $("#city").val().trim();
		
		//자주 쓰는 HTML태그들을 미리 선택해서 상수에 저장	
		const 결과영역 = $("#result"); //--  	 <div id="result">도시를 입력하고 조회 버튼을 누르세요.</div>  선택
		const 버튼 = $("#btn");       //--    <button id="btn">조회</button> 선택

		//1.2. 도시 이름을 <input id="city">에 입력하지 않고 서버에 요청했을 경우  조회() 함수 즉시 종료 
		if(도시 === ""){
			결과영역.html('<span class="err">도시 이름을 입력하세요.</span>');
			return;
		}
		
		//1.3. 조회 중임을 표시하고 조회 버튼 비활성화 해서 더이상 클릭하지 못하게 하자
		버튼.prop("disabled",true);
		결과영역.text("날씨를 불러오는 중입니다........");
		
		//1.4. 첫 번쨰 요청 - 도시 이름을 좌표로 바꾸기 (지오코딩)
		$.ajax({
			url  : "https://geocoding-api.open-meteo.com/v1/search",
			type : "get",
			//요청 데이터 설정
			//
			//  name    찾을 도시 이름 설정 하는 속성(KEY) <- 값을 영문으로 설정 해야 합니다.
			//  count   조회 결과를 몇 개까지 돌려줄지 설정  
			//  language 조회 결과에 붙일 이름의 언어.  ko 를 설정하면 한글로 응답받습니다.
			//  format   응답 데이터 형식
			data : {
				name : 도시,    //"BuSan" 
				count : 1,
				language : "ko",
				format   : "json"
			},
			
			dataType : "json",
			
			//요청 통신에 성공 했을때 function(지오데이터){} 콜백함수 자동 호출 후 지오데이터 매개변수로 응답받습니다.
			success : function(지오데이터){			
				/* 지오데이터 의 실제 모습	
					{
					  "results" : [
								      {
								        "name"      : "부산광역시",
								        "latitude"  : 35.10168,
								        "longitude" : 129.03004,
								        "country_code" : "KR",
								        "timezone"  : "Asia/Seoul"
								      }
					 			  ]
					}
			     */
			     //1.5. 검색 결과가 없는 경우를 처리 합니다.
			     /*
   					참고. 물음표 하나가 붙은 문법 (선택적 접근)

						지오데이터.results?.length

						results 가 없으면 오류를 내지 않고 undefined 를 돌려줍니다.
						물음표가 없으면 값이 없을 때 화면 전체가 멈춥니다.

					참고. ! 기호는 "반대" 라는 뜻입니다.
						undefined 와 0 은 거짓으로 취급되므로
						"결과가 없거나 0개이면 참" 이 됩니다.
			     */
			     if(!지오데이터.results?.length){
			    	 
			    	 //<div id="result">도시를 입력하고 조회 버튼을 누르세요.</div> 결과영역에  넣자 
			    	 결과영역.html('<span class="err">도시를 찾을 수 없습니다.</span>'    
			    			 	 + '<div>도시명을 영문으로 입력하세요. 예 : Seoul, Busan</div>');
			    	 
			    	 //<button id="btn" disabled="true">조회</button> 클릭할수 없는 비활성화 버튼을 활성화 시켜 클릭되게
			    	 버튼.prop("disabled","false");
			    	 return;			    	 
			     }
				 /* 지오데이터 의 실제 모습	
					{
					  "results" : [
								      {
								        "name"      : "부산광역시",
								        "latitude"  : 35.10168,
								        "longitude" : 129.03004,
								        "country_code" : "KR",
								        "timezone"  : "Asia/Seoul"
								      }
					 			  ]
					}
			     */ 
			     //배열의 첫 번째 칸의 {} 객체를 값으로 꺼냅니다.
			     const 장소 = 지오데이터.results[0];
			     /*
			       {
				        "name"      : "부산광역시",
				        "latitude"  : 35.10168,
				        "longitude" : 129.03004,
				        "country_code" : "KR",
				        "timezone"  : "Asia/Seoul"
				   }   
			     */
			     //1.6. 두 번째 요청 - 얻은 좌표(위도, 경도)를 이용해 날씨 조회 
			     $.ajax({
						url  : "https://api.open-meteo.com/v1/forecast", 
						type : "get",
						//요청할 데이터 설정
						data : {
							latitude  : 장소.latitude, //위도 35.10168
							longitude : 장소.longitude, //경도 129.03004
							current   : "temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m",
							timezone  : "Asia/Seoul"
						},
						//응답받을 예상 데이터 유형 설정
						dataType : "json",
						//요청 통신에 성공했을때(날씨 조회 성공시) 실행되는 콜백함수 정의
						success : function(날씨데이터){
							
							//현재 날씨 값들이 담긴 안쪽 {} 객체를 꺼냅니다.
							const 현재  = 날씨데이터.current;
							/*
							{
							      "time"                 : "2026-09-08T19:45",  <- 현재 부산 시간 대  
							      "temperature_2m"       : 24.7,				<- 현재 부산 지상 2미터 높이의 기온
							      "relative_humidity_2m" : 68,                  <- 현재 부산 습도
							      "apparent_temperature" : 25.7,				<- 현재 부산 체감 온도
							      "wind_speed_10m"       : 14.9					<- 현재 부산 지상 10미터 높이의 풍속
							  }						
							*/
							//웹브라우저에 보여질 화면을 만들자
							//<div id="result">도시를 입력하고 조회 버튼을 누르세요.</div> 결과영역에  넣자 
							결과영역.html(`<div class="city">${장소.name}</div>
										 <div class="temp">${현재.temperature_2m}</div>
										 <div class="sub">
										 	체감 ${현재.apparent_temperature}&deg;C &nbsp;|&nbsp;
										 	습도 ${현재.relative_humidity_2m}% &nbsp;|&nbsp; 
										 	바람 풍속 ${현재.wind_speed_10m}km/h
										 </div>
										 <div class="sub">
										 	좌표 ${장소.latitude}, ${장소.longitude}
										 	&nbsp;|&nbsp; ${장소.country || 장소.country_code}
										 </div>
										 <div class="sub">기준 시각 ${현재.time.replace("T"," ")}</div>
									    `);	
						},
						//날씨 조회 요청 통신에 실패시.. 자동 실행되는 콜백함수 정의
						error : function(xhttp){
							//<div id="result">도시를 입력하고 조회 버튼을 누르세요.</div> 결과영역에 "날씨 조회 실패 했습니다.." 넣기
							결과영역.html('<span>날씨 조회 실패 했습니다.(상태코드' + xhttp.status +  ')</span>');
						},
						//날씨 조회 요청 통신이 끝나면? 항상 실행되는 콜백함수 정의
						//
						// 중요. 버튼 이 비활성화 되있으면 활성화 시켜서! 클릭하여 다른 지역의 날씨 정보를 요청하게 하자.
						complete : function(){
							버튼.prop("disabled",false);
						}
			     }); 
				 //-----------------------> 두 번째 요청 함수 $.ajax({   }); 가 여기서 닫힙니다.
				
			},
			//첫 번쨰 요청통신에 실패 했을때...자동호출되는 콜백함수 정의
			error : function(xhttp){
				
				결과영역.html('<span>도시 조회 실패 했습니다.(상태코드' + xhttp.status +  ')</span>');
				
				//도시 정보 요청에 실패하면  두번째 날씨 정보 요청은 보내지 않으므로
				//여기서 조회 버튼을 활성화 시키자
				버튼.prop("disabled",false);
			}			
		}); //----------------------------> 첫 번쨰 요청 함수 $.ajax({    }); 호출 구문이 여기서 끝납니다.
		
			
	} //---- function 조회(){}
	//===================================================================
	//2. 이벤트 등록
	//===================================================================
    
	//2.1. 조회 버튼 <button id="btn">조회</button>에 CLICK 이벤트 등록
	$('#btn').on("click", 조회);
	
	//2.2. 엔터키로도 조회되게 합니다.
	//
	//  입력칸에 글자를 치고 엔터를 누르는 것은 사용자의 자연스러운 습관입니다.
	//  엔터가 동작하지 않으면 불편하다고 느낍니다.
	//
	//<input type="text" id="city" value="Busan" placeholder="영문 도시명 (예: Seoul)"> 에 keydown 이벤트 등록
	//
	//  e.key 로 어떤 키를 눌렀는지 알 수 있습니다.
	$("#city").on("keydown", function(e){		
		if(e.key === "Enter"){
			조회();
		}		
	});
	
	//2.3.  자주 쓰는 도시 버튼 영역을 선택해서 "click"이벤트 등록
	/*
	<div class="quick">
		<span data-name="Seoul">서울</span>
		<span data-name="Busan">부산</span>
		<span data-name="Daegu">대구</span>
		<span data-name="Incheon">인천</span>
		<span data-name="Jeju">제주</span>
		<span data-name="Tokyo">도쿄</span>
	</div>	
	*/
	$(".quick span").on("click",function(){
		
		//클릭한 span의  data-name 속성의 값을 꺼냅니다.
		//  <span data-name="Busan">부산</span>   ->   "Busan" 꺼냄
		const 검색어  = $(this).attr("data-name");
		
		//입력칸  <input type="text" id="city" value="Busan" placeholder="영문 도시명 (예: Seoul)"> 에 
		// 위 검색어를 value속성에 설정하고 곧바로 조회요청 합니다.
		$("#city").val(검색어);
		조회();
	});




</script>

</body>






</html>
