<!--
================================================================================
 파일명   : jq3.html
 단계     : 3단계 jQuery 버전 - 완성본 (날씨 + 미세먼지 + 주간예보)
 짝 파일  : step3.html (fetch 버전)
 대상     : 비전공자
================================================================================

 이 단계에서 배우는 것
 ==========================================================================
 1. $.when 으로 요청 두 개를 동시에 보내는 방법 (Promise.all 에 해당)
 2. $.when 의 결과가 왜 배열로 오는지
 3. 숫자 코드를 사람이 읽는 글자로 바꾸는 방법
 4. 배열을 반복해 카드 여러 개를 만드는 방법


 참고. 동시 호출 문법 비교 (이 단계의 핵심)
 ==========================================================================

   [fetch 버전]  Promise.all 을 사용합니다.

       const [날씨응답, 대기응답] = await Promise.all([
           fetch(날씨주소),
           fetch(대기주소)
       ]);

       결과가 곧바로 데이터입니다.


   [jQuery 버전]  $.when 을 사용합니다.

       $.when( $.ajax(날씨설정), $.ajax(대기설정) )
        .done(function(날씨결과, 대기결과){
            const 날씨데이터 = 날씨결과[0];
            const 대기데이터 = 대기결과[0];
        });

       결과가 배열로 감싸져서 옵니다. 반드시 [0] 을 붙여야 합니다.
       이것이 초보자가 가장 많이 틀리는 부분입니다.


 참고. 왜 앞은 순차, 뒤는 동시인가
 ==========================================================================

   지오코딩 다음 날씨    좌표가 있어야 부를 수 있으므로 순차
   날씨와 대기질 사이    둘 다 좌표만 있으면 되고 서로 관계없으므로 동시

   판단 기준은 단 하나입니다.
     앞의 결과가 뒤 요청에 필요한가?
       필요하다  순차 호출
       필요없다  동시 호출
-->

<script type="text/javascript">

	//===================================================================
	//0. 날씨 코드를 사람이 읽는 글자와 그림으로 바꾸기 위한 목록
	//===================================================================
	/*
		참고. weather_code 란 무엇인가

			날씨 상태를 숫자로 표현한 국제 표준 코드입니다.
			세계기상기구(WMO)가 정한 것으로 어느 나라 API 든 같은 의미입니다.

			서버는 0, 61, 95 같은 숫자만 보내 줍니다.
			화면에 61 이라고 쓰면 아무도 무슨 날씨인지 모르므로
			이름을 미리 적어 두고 바꿔서 보여 줍니다.

		참고. 객체 안에 객체를 넣은 구조입니다.

			날씨코드[0]        { 글 : "맑음", 그림 : 해 그림 }
			날씨코드[0].글     "맑음"

		참고. step3.html 과 완전히 같은 목록입니다.
		     이 부분은 통신과 관계없는 순수 자바스크립트이므로
		     jQuery 를 쓰든 fetch 를 쓰든 코드가 똑같습니다.
	*/
	const 날씨코드 = {
		0  : { 글:"맑음",           그림:"\u2600\uFE0F" },
		1  : { 글:"대체로 맑음",     그림:"\uD83C\uDF24\uFE0F" },
		2  : { 글:"구름 조금",       그림:"\u26C5" },
		3  : { 글:"흐림",           그림:"\u2601\uFE0F" },
		45 : { 글:"안개",           그림:"\uD83C\uDF2B\uFE0F" },
		48 : { 글:"짙은 안개",       그림:"\uD83C\uDF2B\uFE0F" },
		51 : { 글:"약한 이슬비",     그림:"\uD83C\uDF26\uFE0F" },
		53 : { 글:"이슬비",         그림:"\uD83C\uDF26\uFE0F" },
		55 : { 글:"강한 이슬비",     그림:"\uD83C\uDF27\uFE0F" },
		61 : { 글:"약한 비",        그림:"\uD83C\uDF26\uFE0F" },
		63 : { 글:"비",            그림:"\uD83C\uDF27\uFE0F" },
		65 : { 글:"강한 비",        그림:"\uD83C\uDF27\uFE0F" },
		71 : { 글:"약한 눈",        그림:"\uD83C\uDF28\uFE0F" },
		73 : { 글:"눈",            그림:"\u2744\uFE0F" },
		75 : { 글:"강한 눈",        그림:"\u2744\uFE0F" },
		77 : { 글:"싸락눈",         그림:"\u2744\uFE0F" },
		80 : { 글:"소나기",         그림:"\uD83C\uDF26\uFE0F" },
		81 : { 글:"소나기",         그림:"\uD83C\uDF27\uFE0F" },
		82 : { 글:"강한 소나기",     그림:"\u26C8\uFE0F" },
		85 : { 글:"소낙눈",         그림:"\uD83C\uDF28\uFE0F" },
		86 : { 글:"강한 소낙눈",     그림:"\u2744\uFE0F" },
		95 : { 글:"천둥번개",       그림:"\u26C8\uFE0F" },
		96 : { 글:"천둥번개와 우박", 그림:"\u26C8\uFE0F" },
		99 : { 글:"심한 뇌우",      그림:"\u26C8\uFE0F" }
	};

	//요일 이름을 숫자로 얻기 위한 목록입니다.
	//new Date().getDay() 는 0(일요일)부터 6(토요일)까지의 숫자를 돌려줍니다.
	const 요일 = ["일", "월", "화", "수", "목", "금", "토"];


	//===================================================================
	//1. 미세먼지 등급을 판정하는 함수
	//===================================================================
	/*
		참고. 국내 미세먼지 기준 (환경부 기준)

			PM10  (미세먼지)     0~30 좋음 / 31~80 보통 / 81~150 나쁨 / 151 이상 매우나쁨
			PM2.5 (초미세먼지)   0~15 좋음 / 16~35 보통 / 36~75 나쁨 / 76 이상 매우나쁨

			기준이 서로 다르므로 어느 항목인지 함께 넘겨받아 판단합니다.

		참고. 객체를 return 하는 이유

			등급 이름과 색깔 두 가지를 한꺼번에 돌려줘야 하기 때문입니다.
			return 은 값을 하나만 돌려줄 수 있으므로
			두 값을 객체 하나에 담아 돌려줍니다.
	*/
	function 미세먼지등급(값, 종류){

		//삼항 연산자 문법 :  조건식 ? 참일때값 : 거짓일때값
		//구조 분해 할당으로 배열의 값 3개를 변수 3개에 한 번에 담습니다.
		const [좋음, 보통, 나쁨] = (종류 === "pm10") ? [30, 80, 150] : [15, 35, 75];

		//위에서부터 순서대로 검사합니다.
		//참인 것을 만나면 그 자리에서 값을 돌려주고 함수가 끝납니다.
		if(값 <= 좋음)  return { 등급:"좋음",     색:"#1d5fa8" };
		if(값 <= 보통)  return { 등급:"보통",     색:"#16a34a" };
		if(값 <= 나쁨)  return { 등급:"나쁨",     색:"#e08c17" };

		return { 등급:"매우나쁨", 색:"#c0392b" };
	}


	//===================================================================
	//2. 조회 함수
	//===================================================================
	function 조회(){

		//2.1 입력값과 태그를 준비합니다.
		const 도시 = $("#city").val().trim();
		const 결과영역 = $("#result");
		const 버튼 = $("#btn");

		//2.2 빈 값이면 서버를 부르지 않습니다.
		if(도시 === ""){
			결과영역.html('<p class="err">도시 이름을 입력하세요.</p>');
			return;
		}

		//2.3 조회 중임을 표시하고 버튼을 잠급니다.
		버튼.prop("disabled", true);
		결과영역.html('<p class="sub">날씨를 불러오는 중입니다...</p>');

		//===============================================================
		//2.4 첫 번째 요청 - 도시 이름을 좌표로 (순차)
		//===============================================================
		//   이 결과가 있어야 다음 요청을 만들 수 있으므로
		//   반드시 먼저 실행하고 결과를 기다립니다.
		$.ajax({
			url  : "https://geocoding-api.open-meteo.com/v1/search",
			type : "get",
			data : { name : 도시, count : 1, language : "ko", format : "json" },
			dataType : "json",

			success : function(지오데이터){

				//검색 결과가 없으면 results 키 자체가 오지 않습니다.
				//물음표를 붙여 값이 없어도 오류가 나지 않게 합니다.
				if(!지오데이터.results?.length){
					결과영역.html('<p class="err">도시를 찾을 수 없습니다.</p>'
					              + '<p class="sub">도시명을 영문으로 입력하세요. 예 : Seoul, Busan</p>');
					버튼.prop("disabled", false);
					return;
				}

				//배열의 첫 번째 칸을 꺼냅니다. 배열의 첫 칸은 0번입니다.
				const 장소 = 지오데이터.results[0];

				//===========================================================
				//2.5 두 번째와 세 번째 요청 - 동시에 보내기
				//===========================================================
				/*
					===========================================================
					 참고. $.when 이 하는 일 (이 단계에서 가장 중요)
					===========================================================

						괄호 안에 넣은 요청들을 모두 동시에 출발시키고,
						전부 끝나면 .done 에 등록해 둔 함수를 실행합니다.

						fetch 의 Promise.all 과 하는 일이 같습니다.

					참고. 동시 실행이 가능한 원리

						$.ajax({ ... }) 를 호출하는 순간 요청은 이미 출발합니다.
						$.when 은 "출발시켜라" 가 아니라
						"이미 출발한 것들이 다 끝나면 알려 달라" 는 뜻입니다.

					시간 비교

						[순차로 했다면]
						  0초        1초        2초
						  |==날씨====|==대기질===|      총 2초

						[동시에 보내면]
						  0초        1초
						  |==날씨====|
						  |==대기질===|                 총 1초

					===========================================================
					 주의. jQuery 에서 가장 많이 틀리는 부분
					===========================================================

						$.when 의 결과는 데이터가 곧바로 오지 않습니다.
						배열로 한 번 더 감싸져서 옵니다.

						  날씨결과 = [ 실제데이터, "success", xhr객체 ]
						               ---------
						               0번 칸에 데이터가 들어 있습니다

						그래서 반드시 [0] 을 붙여야 합니다.

						  날씨결과.current       틀림. undefined 가 나옵니다
						  날씨결과[0].current    맞음

						fetch 의 Promise.all 은 이런 감싸기가 없습니다.
						이것이 두 방식의 가장 헷갈리는 차이입니다.
				*/

				//2.5.1 날씨 요청 설정
				//
				//   current  지금 시각의 날씨 중 원하는 항목
				//   daily    하루 단위로 받고 싶은 항목
				//   forecast_days  며칠치를 받을지. 최대 16일까지 됩니다.
				const 날씨요청 = $.ajax({
					url  : "https://api.open-meteo.com/v1/forecast",
					type : "get",
					data : {
						latitude  : 장소.latitude,
						longitude : 장소.longitude,
						current   : "temperature_2m,relative_humidity_2m,apparent_temperature,"
						          + "precipitation,weather_code,wind_speed_10m",
						daily     : "weather_code,temperature_2m_max,temperature_2m_min,"
						          + "precipitation_probability_max",
						timezone  : "Asia/Seoul",
						forecast_days : 7
					},
					dataType : "json"
				});

				//2.5.2 대기질 요청 설정
				//
				//   주소의 앞부분이 다릅니다.
				//     날씨   api.open-meteo.com
				//     대기질 air-quality-api.open-meteo.com
				const 대기요청 = $.ajax({
					url  : "https://air-quality-api.open-meteo.com/v1/air-quality",
					type : "get",
					data : {
						latitude  : 장소.latitude,
						longitude : 장소.longitude,
						current   : "pm10,pm2_5",
						timezone  : "Asia/Seoul"
					},
					dataType : "json"
				});

				//2.5.3 두 요청이 모두 끝날 때까지 기다렸다가 실행합니다.
				//
				//   .done  둘 다 성공했을 때 실행됩니다. (fetch 의 try 에 해당)
				//   .fail  하나라도 실패하면 실행됩니다. (fetch 의 catch 에 해당)
				//   .always 성공하든 실패하든 항상 실행됩니다. (fetch 의 finally 에 해당)
				//
				//   주의. $.when 도 하나라도 실패하면 전체가 실패로 처리됩니다.
				//        Promise.all 과 같은 성질입니다.
				$.when(날씨요청, 대기요청)

					.done(function(날씨결과, 대기결과){

						//---------------------------------------------------
						//2.6 배열에서 실제 데이터를 꺼냅니다.
						//---------------------------------------------------
						//   이 두 줄이 fetch 버전에는 없는 부분입니다.
						//   $.when 이 결과를 배열로 감싸서 주기 때문입니다.
						const 날씨데이터 = 날씨결과[0];
						const 대기데이터 = 대기결과[0];

						//---------------------------------------------------
						//2.7 현재 날씨 부분 만들기
						//---------------------------------------------------
						const 현재 = 날씨데이터.current;

						//날씨 코드를 글자와 그림으로 바꿉니다.
						//
						//  || 뒤의 값은 목록에 없는 코드가 왔을 때 대신 쓸 값입니다.
						//  이 처리가 없으면 화면에 undefined 가 찍힙니다.
						const 상태 = 날씨코드[현재.weather_code] || { 글:"정보 없음", 그림:"" };

						//---------------------------------------------------
						//2.8 미세먼지 부분 만들기
						//---------------------------------------------------
						//   주의. 키 이름이 pm2_5 입니다. pm25 가 아닙니다.
						//        가운데 밑줄을 빠뜨리면 undefined 가 나옵니다.
						const 대기 = 대기데이터.current;

						const pm10등급 = 미세먼지등급(대기.pm10, "pm10");
						const pm25등급 = 미세먼지등급(대기.pm2_5, "pm25");

						//---------------------------------------------------
						//2.9 주간 예보 부분 만들기
						//---------------------------------------------------
						/*
							참고. daily 데이터의 구조 (처음 보면 반드시 헷갈리는 부분)

								날짜별로 객체가 나열된 것이 아닙니다.
								항목별로 배열이 따로따로 들어 있습니다.

								"daily" : {
								   "time"               : ["2026-09-04", "2026-09-05", .....],
								   "weather_code"       : [0,            3,            .....],
								   "temperature_2m_max" : [28.1,         26.4,         .....],
								   "temperature_2m_min" : [21.3,         20.8,         .....]
								}

								같은 위치의 칸끼리 짝을 이룹니다.

								  0번 칸 :  2026-09-04  코드 0  최고 28.1  최저 21.3
								  1번 칸 :  2026-09-05  코드 3  최고 26.4  최저 20.8

								그래서 time 배열을 기준으로 반복하면서
								같은 번호(i)로 다른 배열의 값을 꺼내면 됩니다.

							참고. $.each 반복 문법

								$.each(배열, function(인덱스, 값){ ... })

								인덱스  지금 몇 번째 칸인지 (0부터 시작)
								값      그 칸에 들어 있는 실제 데이터

								fetch 버전에서는 map 과 join 을 썼습니다.
								여기서는 jQuery 답게 $.each 로 만들어 봅니다.
						*/
						const 예보 = 날씨데이터.daily;

						//누적해서 담을 변수입니다.
						//let 을 쓰는 이유는 반복문에서 계속 덧붙이기 때문입니다.
						let 예보html = "";

						$.each(예보.time, function(i, 날짜){

							//2.9.1 날짜 글자를 날짜 객체로 바꿉니다.
							//    "2026-09-04" 라는 글자만으로는 무슨 요일인지 알 수 없습니다.
							const d = new Date(날짜);

							//2.9.2 요일 이름을 얻습니다.
							//    getDay() 는 0(일요일)부터 6(토요일)까지의 숫자를 돌려줍니다.
							//    i 가 0 이면 오늘이므로 요일 대신 "오늘" 이라고 표시합니다.
							const 요일이름 = (i === 0) ? "오늘" : 요일[d.getDay()];

							//2.9.3 날짜에서 월과 일만 잘라냅니다.
							//    substring(5) 는 5번 위치부터 끝까지 잘라냅니다.
							//      "2026-09-04".substring(5)  ->  "09-04"
							const 월일 = 날짜.substring(5);

							//2.9.4 그날의 날씨 코드를 글자와 그림으로 바꿉니다.
							const 하루상태 = 날씨코드[예보.weather_code[i]] || { 글:"", 그림:"" };

							//2.9.5 카드 하나를 만들어 뒤에 덧붙입니다.
							//
							//   += 는 "기존 값 뒤에 덧붙여라" 는 뜻입니다.
							//   Math.round 는 소수점을 반올림해 정수로 만듭니다.
							예보html += `
								<div class="day">
									<div class="dayname">${요일이름}</div>
									<div class="dayico" title="${하루상태.글}">${하루상태.그림}</div>
									<div class="daytmp">
										<span class="daymax">${Math.round(예보.temperature_2m_max[i])}&deg;</span>
										/
										<span class="daymin">${Math.round(예보.temperature_2m_min[i])}&deg;</span>
									</div>
									<div class="dayrain">비 ${예보.precipitation_probability_max[i]}%</div>
									<div class="dayrain">${월일}</div>
								</div>`;
						});

						//---------------------------------------------------
						//2.10 완성한 HTML 을 결과 영역에만 넣습니다.
						//---------------------------------------------------
						//   태그를 만들어 넣는 것이므로 .html() 을 씁니다.
						//   페이지 전체가 새로 그려지지 않고 이 div 안쪽만 바뀝니다.
						결과영역.html(`
							<div class="now">
								<div class="city">${장소.name}</div>
								<div class="icon">${상태.그림}</div>
								<div class="temp">${현재.temperature_2m}&deg;C</div>
								<div class="desc">${상태.글}</div>
								<div class="sub">
									체감 ${현재.apparent_temperature}&deg;C &nbsp;|&nbsp;
									습도 ${현재.relative_humidity_2m}% &nbsp;|&nbsp;
									바람 ${현재.wind_speed_10m}km/h &nbsp;|&nbsp;
									강수 ${현재.precipitation}mm
								</div>
								<div class="sub">기준 시각 ${현재.time.replace("T", " ")}</div>
							</div>

							<div class="air">
								<div class="airbox">
									<div class="airlab">미세먼지 PM10</div>
									<div class="airval" style="color:${pm10등급.색}">
										${대기.pm10} <span style="font-size:14px">${pm10등급.등급}</span>
									</div>
								</div>
								<div class="airbox">
									<div class="airlab">초미세먼지 PM2.5</div>
									<div class="airval" style="color:${pm25등급.색}">
										${대기.pm2_5} <span style="font-size:14px">${pm25등급.등급}</span>
									</div>
								</div>
							</div>

							<div class="week">${예보html}</div>`);
					})

					//둘 중 하나라도 실패하면 실행됩니다.
					.fail(function(){
						결과영역.html('<p class="err">날씨 정보를 가져오지 못했습니다.</p>');
					})

					//성공하든 실패하든 항상 실행됩니다.
					//버튼 잠금 해제를 여기에 써야 오류가 나도 버튼이 풀립니다.
					.always(function(){
						버튼.prop("disabled", false);
					});
			},

			//지오코딩 자체가 실패했을 때 실행됩니다.
			error : function(xhttp){
				결과영역.html('<p class="err">도시 검색에 실패했습니다. (상태코드 '
				              + xhttp.status + ')</p>');
				버튼.prop("disabled", false);
			}
		});
	}


	//===================================================================
	//3. 이벤트 등록
	//===================================================================

	//3.1 조회 버튼
	$("#btn").on("click", 조회);

	//3.2 엔터키로도 조회되게 합니다.
	$("#city").on("keydown", function(e){
		if(e.key === "Enter"){
			조회();
		}
	});

	//3.3 자주 쓰는 도시 버튼
	//    jQuery 는 여러 태그를 찾으면 반복문 없이 한 번에 이벤트를 걸 수 있습니다.
	//    $(this) 는 지금 클릭된 그 span 자신을 가리킵니다.
	$(".quick span").on("click", function(){
		$("#city").val($(this).attr("data-name"));
		조회();
	});


	//===================================================================
	//4. 화면이 열리면 자동으로 한 번 조회합니다.
	//===================================================================
	/*
		참고. $(function(){ ... }) 문법

			"HTML 문서를 브라우저가 다 읽고 나면 이 안의 코드를 실행하라" 는 뜻입니다.
			$(document).ready(function(){ ... }) 의 줄임 표기입니다.

			fetch 버전의 DOMContentLoaded 이벤트와 같은 역할입니다.

		참고. 왜 자동 조회를 넣는가

			화면을 열었는데 아무것도 없으면 사용자는 무엇을 해야 할지 모릅니다.
			기본 도시의 날씨를 미리 보여 주면 사용법을 바로 이해합니다.
	*/
	$(function(){
		조회();
	});

/*
	=====================================================================
	 참고. 이 파일과 step3.html 의 핵심 차이 정리
	=====================================================================

	  하는 일              fetch 버전 (step3.html)          jQuery 버전 (이 파일)
	  ------------------   ------------------------------   ------------------------------
	  동시 호출            Promise.all([ ... ])             $.when( ... )
	  결과 받기            const [a, b] = await ...         .done(function(a, b){ ... })
	  데이터 꺼내기        a 가 곧바로 데이터                a[0] 으로 한 번 더 꺼내야 함
	  성공 처리            try 블록                          .done()
	  실패 처리            catch 블록                        .fail()
	  뒷정리               finally 블록                      .always()
	  반복 출력            map + join                        $.each
	  문서 준비 완료       DOMContentLoaded                  $(function(){ })


	=====================================================================
	 참고. 세 단계를 모두 마친 뒤 정리
	=====================================================================

		1단계  기본 구조는 두 방식이 크게 다르지 않습니다.
		       jQuery 가 조금 더 짧고 오류 처리도 자동입니다.

		2단계  요청을 이어서 보내면 차이가 벌어집니다.
		       jQuery 는 콜백 안에 콜백이 들어가 들여쓰기가 깊어집니다.
		       fetch 는 위에서 아래로 그대로 읽힙니다.

		3단계  동시 호출은 둘 다 가능하지만
		       jQuery 는 결과에 [0] 을 붙여야 하는 함정이 있습니다.

		결론
		  기존 프로젝트를 유지보수할 때는 jQuery 를 읽을 줄 알아야 하고,
		  새로 만들 때는 fetch 를 쓰는 것이 맞습니다.
*/
</script>

</body>
</html>
