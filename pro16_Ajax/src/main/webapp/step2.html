<!--
================================================================================
 파일명   : step2.html
 단계     : 2단계 - 도시 이름으로 날씨 조회하기 (요청을 순서대로 두 번)
 대상     : 비전공자
================================================================================

 이 단계의 목표
 ==========================================================================
 1단계에서는 좌표가 코드에 고정되어 서울 날씨만 볼 수 있었습니다.
 이번에는 사용자가 도시 이름을 입력하면 그 도시의 날씨를 보여 줍니다.


 이 단계에서 배우는 것
 ==========================================================================
 1. 앞 요청의 결과를 뒤 요청에 넘기는 순차 호출
 2. 결과가 없을 때를 대비하는 방법
 3. 물음표 하나를 붙이는 선택적 접근 문법
 4. 입력칸과 엔터키를 다루는 방법


 참고. 왜 요청을 두 번 보내야 하는가
 ==========================================================================

   날씨 API 는 도시 이름을 받지 않습니다. 위도와 경도만 받습니다.
   그래서 도시 이름을 좌표로 바꿔 주는 API 를 먼저 호출해야 합니다.

   이렇게 이름을 좌표로 바꾸는 것을 지오코딩이라고 부릅니다.


 참고. 이 화면의 동작 순서 (순차 호출)
 ==========================================================================

   [브라우저]  Busan 입력 후 조회
       |
       | (1) 지오코딩 API 요청
       |     geocoding-api.open-meteo.com/v1/search?name=Busan
       V
   [지오코딩 서버]
       |
       | (2) 부산광역시 / 위도 35.10 / 경도 129.03 응답
       V
   [브라우저]
       |
       | (3) 받은 좌표를 가지고 날씨 API 요청
       |     api.open-meteo.com/v1/forecast?latitude=35.10&longitude=129.03
       V
   [날씨 서버]
       |
       | (4) 그 좌표의 현재 날씨 응답
       V
   [브라우저]
       |
       | (5) 결과 영역에만 표시

   중요. 두 요청은 반드시 순서대로 실행해야 합니다.
        앞의 결과(좌표)가 있어야 뒤 요청을 보낼 수 있기 때문입니다.
        이런 관계를 순차 호출이라고 합니다.

        서로 관계가 없는 요청이라면 동시에 보내는 것이 빠릅니다.
        그 방법은 3단계에서 배웁니다.


 참고. 반드시 알아야 할 함정
 ==========================================================================

   지오코딩은 도시 이름을 영문으로 검색해야 합니다.

     name=Seoul   ->  서울특별시가 나옵니다
     name=서울     ->  결과가 하나도 나오지 않습니다

   대신 language=ko 를 붙이면 결과 이름은 한글로 옵니다.
   그래서 화면에는 "서울특별시" 라고 예쁘게 표시됩니다.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2단계 - 도시 이름으로 날씨 조회하기</title>

	<style type="text/css">
		body    { font-family:'Malgun Gothic'; padding:24px; background:#f4f7fb; }
		h2      { color:#1d5fa8; }
		.box    { background:#fff; border:1px solid #d5e0ec; border-radius:10px;
		          padding:22px; max-width:620px; }
		input   { padding:9px; border:1px solid #93a5bd; border-radius:5px; width:210px;
		          font-size:15px; }
		button  { background:#1d5fa8; color:#fff; border:none; padding:10px 20px;
		          border-radius:7px; cursor:pointer; font-size:14px; margin-left:4px; }
		button:disabled { background:#8fa2bb; cursor:not-allowed; }

		.quick  { margin-top:10px; }
		.quick span { display:inline-block; background:#e8f0fb; color:#1d5fa8;
		              border-radius:12px; padding:4px 12px; margin:3px 3px 0 0;
		              font-size:13px; cursor:pointer; }
		.quick span:hover { background:#1d5fa8; color:#fff; }

		#result { margin-top:18px; padding:20px; background:#e8f0fb; border-radius:8px;
		          min-height:60px; }
		.city   { font-size:17px; color:#1d5fa8; font-weight:bold; }
		.temp   { font-size:44px; font-weight:bold; color:#0f1c2e; }
		.sub    { font-size:14px; color:#4a6280; margin-top:6px; }
		.err    { color:#c0392b; font-weight:bold; }
		.note   { color:#6b7c93; font-size:13px; margin-top:14px; }
		.nav    { margin-top:16px; font-size:14px; }
		.nav a  { color:#1d5fa8; font-weight:bold; text-decoration:none; margin-right:12px; }
	</style>
</head>
<body>

<h2>2단계 - 도시 이름으로 날씨 조회하기</h2>

<div class="box">


	도시 : <input type="text" id="city" value="Busan" placeholder="영문 도시명 (예: Seoul)">
	<button id="btn">조회</button>

	<!--
		자주 쓰는 도시를 눌러서 바로 조회할 수 있는 버튼들입니다.
		data-name 속성에 검색어를 담아 두고 자바스크립트가 꺼내 씁니다.

		참고. data- 로 시작하는 속성은
		      개발자가 마음대로 만들어 값을 보관할 수 있는 속성입니다.
		      화면에는 보이지 않고 값만 담아 두는 용도입니다.
	-->
	<div class="quick">
		<span data-name="Seoul">서울</span>
		<span data-name="Busan">부산</span>
		<span data-name="Daegu">대구</span>
		<span data-name="Incheon">인천</span>
		<span data-name="Gwangju">광주</span>
		<span data-name="Jeju">제주</span>
		<span data-name="Tokyo">도쿄</span>
		<span data-name="New York">뉴욕</span>
	</div>

	<div id="result">도시를 입력하고 조회 버튼을 누르세요.</div>

	<p class="note">F12 Network 탭을 열고 조회해 보세요.
	   요청이 <b>두 번</b> 나가는 것을 확인할 수 있습니다.
	   먼저 search 요청, 그 다음 forecast 요청 순서입니다.</p>

	<div class="nav">
		<a href="index.html">처음으로</a>
		<a href="step1.html">1단계</a>
		<a href="guide.html">자습서</a>
		<a href="step3.html">3단계로 넘어가기</a>
	</div>
</div>

<script type="text/javascript">

	//===================================================================
	//1. 날씨 조회 함수
	//===================================================================
	//   async 를 붙였으므로 이 함수 안에서 await 를 사용할 수 있습니다.
	async function 조회(){

		//1.1. <input type="text" id="city" value="Busan" placeholder="영문 도시명 (예: Seoul)"> 에 입력한 도시 이름 얻기
		const 도시 = document.getElementById("city").value.trim();
		
		//자주 쓰는 HTML태그들을 미리 선택해서 상수에 저장	
		const 결과영역 = document.getElementById("result");  //--  <div id="result">도시를 입력하고 조회 버튼을 누르세요.</div>  선택
		const 버튼 = document.getElementById("btn");        //--  <button id="btn">조회</button> 선택

		//1.2. 도시 이름을 <input id="city">에 입력하지 않고 서버에 요청했을 경우  조회() 함수 즉시 종료 
		if(도시 === ""){
			결과영역.innerHTML = '<span class="err">도시 이름을 입력하세요.</span>';
			return;
		}
		//1.3. 조회 중임을 표시하고 조회 버튼 비활성화 해서 더이상 클릭하지 못하게 하자
		버튼.disabled = true;
		결과영역.textContent = "날씨를 불러오는 중입니다........";

		try{
			//1.4. 첫 번쨰 요청 - 도시 이름을 좌표로 바꾸기 (지오코딩)
			//요청 주소 만들기
			/*
				참고. encodeURIComponent 를 쓰는 이유

					주소에 공백이나 특수문자가 그대로 들어가면
					서버가 값을 잘못 해석하거나 요청 자체가 실패합니다.

					encodeURIComponent("New York")  ->  "New%20York"
					                                        공백이 %20 으로 바뀜

					이 처리를 하지 않으면 "New York" 같은 두 단어 도시를
					검색할 때 오류가 납니다.

				참고. 이 API 가 받는 값들의 의미

					name      찾을 도시 이름 (영문으로 써야 합니다)
					count     결과를 몇 개까지 돌려줄지
					language  결과에 붙일 이름의 언어. ko 를 주면 한글로 옵니다.
					format    응답 형식. json 을 지정합니다.
			*/
			const 지오주소 = `https://geocoding-api.open-meteo.com/v1/search`
			              + `?name=${encodeURIComponent(도시)}`
			              + `&count=1`
			              + `&language=ko`
			              + `&format=json`;
		
			//요청을 보내고 응답이 올때까지 이함수만 기다립니다.
			const 지오응답 = await fetch(지오주소);
			
			//상태 검사 (fetch 는 404, 500 에서도 예외를 던지지 않으므로 필수)
			if(!지오응답.ok){
				throw new Error(`지오코딩 서버 오류 ${지오응답.status}`);
			}
			
			//Http응답메세지 본문(body)영역의 응답받은 도시정보를 {} 객체 형태로 받기
			const 지오데이터 = await 지오응답.json();
			/*
				지오데이터 의 실제 모습
				{
				  "results" : [
							      {
							        "id"           : 1838524,
							        "name"         : "부산광역시",
							        "latitude"     : 35.10168,
							        "longitude"    : 129.03004,            <==============  배열 [] 의 0 index 칸에 저장된 {} 객체 
							        "country_code" : "KR",
							        "admin1"       : "부산광역시",
							        "timezone"     : "Asia/Seoul",
							        "population"   : 3285147
							      }
							  ]
				}
			*/
			//1.5. 검색 결과가 없는 경우 처리
			if(!지오데이터.results?.length){
				//throw 는 "여기서 일부러 오류를 발생시켜 catch 블럭으로 보내라" 명령어 입니다.
				throw new Error("도시 정보를 조회할수 없습니다");
			}
			
			//1.6. 첫번째 도시 정보 조회요청 결과를 꺼냅니다.
			const 장소 = 지오데이터.results[0];
			/*
			  {
		        "id"           : 1838524,
		        "name"         : "부산광역시",
		        "latitude"     : 35.10168,
		        "longitude"    : 129.03004,            <==============  배열 [] 의 0 index 칸에 저장된 {} 객체 
		        "country_code" : "KR",
		        "admin1"       : "부산광역시",
		        "timezone"     : "Asia/Seoul",
		        "population"   : 3285147
		      }
			*/
			//1.7. 두 번째 요청 - 받은 좌표로 날씨 조회하기
			//요청 주소 만들기
			const 날씨주소 = `https://api.open-meteo.com/v1/forecast`
						+ `?latitude=${장소.latitude}`
						+ `&longitude=${장소.longitude}`
						+ `&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m`;
						+ `&timezone=Asia%2Seoul`;
			
			 //요청을 보내고 응답이 올때까지 이함수만 기다립니다.
			 const 날씨응답 = await fetch(날씨주소);
			 
			 //상태 검사 (fetch 는 404, 500 에서도 예외를 던지지 않으므로 필수)
			 if (!날씨응답.ok) {
				throw new Error(`날씨 서버 오류 ${날씨응답.status}`);
			 }
			 //Http응답메세지 본문(body)영역의 응답받은 날씨정보를 {} 객체 형태로 받기
			 const 날씨데이터 = await 날씨응답.json();
			 
			 console.log(날씨데이터);
			 /*
                날씨데이터 의 실제 모습
			 {
				    "latitude": 35.1,
				    "longitude": 129,
				    "generationtime_ms": 0.10418891906738281,
				    "utc_offset_seconds": 0,
				    "timezone": "GMT",
				    "timezone_abbreviation": "GMT",
				    "elevation": 16,
				    "current_units": {
				        "time": "iso8601",
				        "interval": "seconds",
				        "temperature_2m": "°C",
				        "relative_humidity_2m": "%",
				        "apparent_temperature": "°C",
				        "wind_speed_10m": "km/h"
				    },
				    "current": {
				        "time": "2026-09-08T03:15",
				        "interval": 900,
				        "temperature_2m": 27.6,
				        "relative_humidity_2m": 60,
				        "apparent_temperature": 30.2,
				        "wind_speed_10m": 14.7
				    }
				}
			 */
			 	 		 
			 const 현재 = 날씨데이터.current;
			 /*
					{
				        "time": "2026-09-08T03:15",
				        "interval": 900,
				        "temperature_2m": 27.6,
				        "relative_humidity_2m": 60,
				        "apparent_temperature": 30.2,
				        "wind_speed_10m": 14.7
				    }
			 
			 
			 */
			 
			 //1.8. 날씨 정보를 화면에 표시하기
				결과영역.innerHTML = `
									<div class="city">${장소.name}</div>
									<div class="temp">${현재.temperature_2m}&deg;C</div>
									<div class="sub">
										체감 ${현재.apparent_temperature}&deg;C &nbsp;|&nbsp;
										습도 ${현재.relative_humidity_2m}% &nbsp;|&nbsp;
										바람 ${현재.wind_speed_10m}km/h
									</div>
									<div class="sub">
										좌표 ${장소.latitude}, ${장소.longitude}
										&nbsp;|&nbsp; ${장소.country || 장소.country_code}
									</div>
									<div class="sub">기준 시각 ${현재.time.replace("T", " ")}</div>`;
			
		}catch (err) {
			//1.9. 오류 처리
			//<div id="result">도시를 입력하고 조회 버튼을 누르세요.</div> 결과영역에 "날씨 조회 실패 했습니다.." 넣기
			결과영역.innerHTML = '<span>날씨 조회 실패 했습니다.(에러메세지' + err.message +  ')</span>'
							 + '<div class="sub">도시명을 영문으로 입력했는지 확인하세요. 예: Seoul, Busan</div>';
			
			console.log("오류발생", err);
		
		}finally {
			//요청에 성공하든 실패하든 반드시 버튼 활성화 시키자
			버튼.disabled = false;
		}
		
	}

	//===================================================================
	//2. 조회 버튼에 클릭 이벤트를 등록합니다.
	//===================================================================
	// id="btn" 인 <button>에 클릭 이벤트를 등록합니다.
	document.getElementById("btn").addEventListener("click",조회);


	//===================================================================
	//3. 엔터키로도 조회되게 합니다.
	//===================================================================
	document.getElementById("city").addEventListener("keydown", (e) => {
		if(e.key === "Enter"){
			조회();
		}
	});
	
	//===================================================================
	//4. 자주 쓰는 도시 버튼
	//===================================================================
	document.querySelectorAll(".quick span").forEach((칩)=>{
		
		칩.addEventListener("click",()=>{
			
			//4.1. 클릭한 <sapn>의 data-name 속성값 얻기
			const 검색어 = 칩.getAttribute("data-name"); //"Busan"
			
			//4.2. 도시이름 입력 <inuput id="city" value="Busan">에 도시이름 검색어를 value속성에 설정
			document.getElementById("city").value = 검색어;
			
			//4.3. 곧바로 조회 요청 합니다.
			조회();
		});
		
	});
/*
	<div class="quick">
		<span data-name="Seoul">서울</span>      0 
		<span data-name="Busan">부산</span>      1
		<span data-name="Daegu">대구</span>      2
		<span data-name="Incheon">인천</span>    3
		<span data-name="Gwangju">광주</span>    4
		<span data-name="Jeju">제주</span>
 		<span data-name="Tokyo">도쿄</span>
		<span data-name="New York">뉴욕</span>
	</div>
*/	
	
	
	
/*
	=====================================================================
	 참고. 순차 호출과 동시 호출의 차이
	=====================================================================

		[순차 호출]  이 단계에서 사용한 방식

		  0초        1초        2초
		  |==지오코딩==|==날씨====|

		  총 2초가 걸립니다.
		  앞의 결과(좌표)가 있어야 뒤 요청을 만들 수 있으므로
		  이 경우에는 순차 호출이 반드시 맞습니다.


		[동시 호출]  3단계에서 배울 방식

		  0초        1초
		  |==날씨====|
		  |==대기질===|

		  총 1초면 끝납니다.
		  날씨와 대기질은 서로 관계가 없고 둘 다 좌표만 있으면 되므로
		  동시에 보내는 것이 훨씬 빠릅니다.

		판단 기준
		  앞의 결과가 뒤 요청에 필요한가?
		    필요하다  ->  순차 호출
		    필요없다  ->  동시 호출 (Promise.all)


	=====================================================================
	 참고. 이 단계에서 남은 문제와 3단계에서 해결할 것
	=====================================================================

		1. 미세먼지 정보가 없습니다.
		2. 내일 이후의 예보가 없습니다.
		3. 맑음 흐림 같은 날씨 상태가 표시되지 않습니다.

		3단계에서 날씨와 대기질을 동시에 요청해 이 문제를 해결하고
		주간 예보까지 추가해 완성본을 만듭니다.
*/
